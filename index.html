"Hähnchenbrust","Reis","Nudeln","Eier","Kartoffeln",

"Thunfisch","Wrap","Gurke","Erbsen","Karotten",
"Schinken","Pesto","Parmesan","Brot","Quark",
"Mozzarella","Rinderhackfleisch"
];

let selectedIngredients=[];
let currentCategory="Alle";

let shoppingList=
JSON.parse(localStorage.getItem("shoppingList")||"[]");

let favorites=
JSON.parse(localStorage.getItem("favorites")||"[]");


const ingredientButtons=
document.getElementById("ingredientButtons");

ingredientList.forEach(item=>{

const el=document.createElement("div");

el.className="ingredient";
el.textContent=item;

el.onclick=()=>{

el.classList.toggle("selected");

if(selectedIngredients.includes(item)){
selectedIngredients=
selectedIngredients.filter(x=>x!==item);
}else{
selectedIngredients.push(item);
}

};

ingredientButtons.appendChild(el);

});


function setCategory(category,button){

currentCategory=category;

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

showRecipes();

}


function showRecipes(){

const search=
document.getElementById("search").value.toLowerCase();

const maxCalories=
Number(document.getElementById("calorieFilter").value);

const maxTime=
Number(document.getElementById("timeFilter").value);

let results=recipes.filter(recipe=>{

const matchesSearch=
recipe.name.toLowerCase().includes(search) ||
recipe.ingredients.some(x=>
x[0].toLowerCase().includes(search));

const matchesCategory=
currentCategory==="Alle" ||
recipe.category===currentCategory;

return
recipe.calories<=maxCalories &&
recipe.time<=maxTime &&
matchesSearch &&
matchesCategory;

});


if(selectedIngredients.length>0){

results=results
.map(recipe=>{

let matches=recipe.ingredients.filter(x=>
selectedIngredients.includes(x[0])
).length;

return {...recipe,matches};

})
.filter(x=>x.matches>0)
.sort((a,b)=>b.matches-a.matches);

}

renderRecipes(results);

}


function renderRecipes(results){

const container=
document.getElementById("results");

container.innerHTML="";

if(results.length===0){

container.innerHTML=
`<div class="card empty">
😕 Kein passendes Rezept gefunden.<br><br>
Versuche andere Zutaten oder Filter.
</div>`;

return;

}

results.forEach(recipe=>{

container.innerHTML+=recipeHTML(recipe);

});

}


function recipeHTML(recipe){

const favorite=
favorites.includes(recipe.name);

return`

<div class="recipe">

<h3>${recipe.name}</h3>

<div class="info">
<span>⏱️ ${recipe.time} Min.</span>
<span>🔥 ${recipe.calories} kcal</span>
<span class="badge">${recipe.category}</span>
</div>

<h4>👥 Portionen</h4>

<div class="portions">

<button onclick="changePortions('${recipe.name}',-1)">−</button>

<span id="portion-${safeId(recipe.name)}">1</span>

<button onclick="changePortions('${recipe.name}',1)">+</button>

</div>

<h4>🛒 Zutaten</h4>

<ul id="ingredients-${safeId(recipe.name)}">

${recipe.ingredients.map(x=>
`<li>${formatAmount(x[1],x[2])} ${x[0]}</li>`
).join("")}

</ul>

<h4>👨‍🍳 Zubereitung</h4>

<ol>
${recipe.steps.map(x=>`<li>${x}</li>`).join("")}
</ol>

<button class="green"
onclick="addToShopping('${recipe.name}')">
🛒 Zur Einkaufsliste
</button>

<button class="favorite"
onclick="toggleFavorite('${recipe.name}')">
${favorite?"💔 Aus Favoriten entfernen":"❤️ Favorit speichern"}
</button>

</div>

`;

}


let portions={};


function safeId(name){
return name.replace(/[^a-zA-Z0-9]/g,"");
}


function changePortions(name,direction){

if(!portions[name]) portions[name]=1;

portions[name]+=direction;

if(portions[name]<1) portions[name]=1;
if(portions[name]>6) portions[name]=6;

const recipe=
recipes.find(x=>x.name===name);

const id=safeId(name);

const portionElement=
document.getElementById("portion-"+id);

if(portionElement)
portionElement.textContent=portions[name];

const list=
document.getElementById("ingredients-"+id);

if(list){

list.innerHTML=
recipe.ingredients.map(x=>
`<li>${formatAmount(x[1]*portions[name],x[2])} ${x[0]}</li>`
).join("");

}

}


function formatAmount(amount,unit){

if(amount===0.5)
return "½ "+unit;

if(amount%1===0)
return amount+" "+unit;

return amount.toFixed(1)+" "+unit;

}


function addToShopping(name){

const recipe=
recipes.find(x=>x.name===name);

const multiplier=
portions[name]||1;

recipe.ingredients.forEach(item=>{

const existing=
shoppingList.find(x=>x.name===item[0]);

if(existing){

existing.amount+=item[1]*multiplier;

}else{

shoppingList.push({
name:item[0],
amount:item[1]*multiplier,
unit:item[2],
done:false
});

}

});

saveShoppingList();

alert("🛒 Zutaten wurden hinzugefügt!");

}


function saveShoppingList(){

localStorage.setItem(
"shoppingList",
JSON.stringify(shoppingList)
);

renderShoppingList();

}

document.getElementById("shoppingList");

container.innerHTML=
`<div class="empty">
Deine Einkaufsliste ist leer.
</div>`;

return;

}

shoppingList.forEach((item,index)=>{

container.innerHTML+=`

<div class="shop ${item.done?"done":""}">

<input
type="checkbox"
${item.done?"checked":""}
onchange="toggleShop(${index})">

<span>
${formatAmount(item.amount,item.unit)}
${item.name}
</span>

<button
class="delete red"
onclick="removeShop(${index})">
🗑️
</button>

</div>

`;

});

}


function toggleShop(index){

shoppingList[index].done=
!shoppingList[index].done;

saveShoppingList();

}


function removeShop(index){

shoppingList.splice(index,1);

saveShoppingList();

}


function clearShoppingList(){

if(confirm("Einkaufsliste wirklich löschen?")){

shoppingList=[];

saveShoppingList();

}

}


function toggleFavorite(name){

if(favorites.includes(name)){

favorites=
favorites.filter(x=>x!==name);

}else{

favorites.push(name);

}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

showRecipes();
renderFavorites();

}


function renderFavorites(){

const container=
document.getElementById("favorites");

container.innerHTML="";

if(favorites.length===0){

container.innerHTML=
`<div class="empty">
Noch keine Favoriten ❤️
</div>`;

return;

}

favorites.forEach(name=>{

const recipe=
recipes.find(x=>x.name===name);

if(recipe)
container.innerHTML+=recipeHTML(recipe);

});

}


function randomRecipe(){

const maxCalories=
Number(document.getElementById("calorieFilter").value);

const maxTime=
Number(document.getElementById("timeFilter").value);

const possible=
recipes.filter(x=>
x.calories<=maxCalories &&
x.time<=maxTime
);

if(possible.length===0)return;

const recipe=
possible[Math.floor(Math.random()*possible.length)];

document.getElementById("results").innerHTML=
recipeHTML(recipe);

window.scrollTo({
top:document.getElementById("results").offsetTop,
behavior:"smooth"
});

}


showRecipes();
renderShoppingList();
renderFavorites();

</script>

</body>
</html>
