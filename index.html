<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was koche ich heute?</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#222
}

header{
background:linear-gradient(135deg,#ff7a00,#ff3d00);
color:white;
padding:28px 16px;
text-align:center
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0 0;
font-size:16px
}

.container{
max-width:760px;
margin:auto;
padding:15px
}

.card,.recipe{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08)
}

h2{margin-top:0}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin-bottom:10px
}

.ingredients{
display:flex;
flex-wrap:wrap;
gap:8px
}

.ingredient{
padding:10px 13px;
border:2px solid #ddd;
border-radius:30px;
background:white;
cursor:pointer
}

.ingredient.selected{
background:#ff5a00;
border-color:#ff5a00;
color:white
}

button{
width:100%;
border:0;
border-radius:13px;
padding:14px;
margin-top:9px;
font-size:16px;
font-weight:bold;
background:#ff5a00;
color:white
}

button.dark{background:#222}
button.green{background:#159447}
button.red{background:#d93636}
button.favorite{
background:#ffe5e5;
color:#d00000
}

.filters{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.recipe h3{
margin-top:0;
font-size:22px
}

.info{
display:flex;
flex-wrap:wrap;
gap:10px;
color:#666;
margin-bottom:12px
}

.badge{
display:inline-block;
padding:5px 9px;
background:#eee;
border-radius:20px;
font-size:13px
}

.recipe ul,
.recipe ol{
padding-left:22px
}

.shop{
display:flex;
align-items:center;
gap:8px;
padding:11px 0;
border-bottom:1px solid #eee
}

.shop input{
width:20px;
height:20px;
margin:0
}

.shop.done span{
text-decoration:line-through;
color:#999
}

.delete{
width:auto;
padding:7px 10px;
margin:0;
margin-left:auto;
font-size:13px
}

.empty{
text-align:center;
color:#777;
padding:15px
}

.category-buttons{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:5px
}

.category{
white-space:nowrap;
padding:9px 13px;
border:2px solid #ddd;
border-radius:25px;
background:white;
width:auto;
margin:0
}

.category.active{
background:#222;
color:white
}

.portions{
display:flex;
align-items:center;
gap:10px
}

.portions button{
width:45px;
margin:0;
padding:10px
}

.portions span{
font-weight:bold;
font-size:18px
}

.result-count{
font-weight:bold;
margin-bottom:12px;
color:#555
}
</style>
</head>

<body>

<header>
<h1>🍳 Was koche ich heute?</h1>
<p>Schnelle Gerichte unter 600 kcal</p>
</header>

<div class="container">

<div class="card">

<h2>🔎 Rezept suchen</h2>

<input
id="search"
placeholder="z.B. Eier Paprika Mozzarella..."
oninput="showRecipes()">

<div class="category-buttons">

<button class="category active"
onclick="setCategory('Alle',this)">
Alle
</button>

<button class="category"
onclick="setCategory('Hähnchen',this)">
🍗 Hähnchen
</button>

<button class="category"
onclick="setCategory('Pasta',this)">
🍝 Pasta
</button>

<button class="category"
onclick="setCategory('Reis',this)">
🍚 Reis
</button>

<button class="category"
onclick="setCategory('Wrap',this)">
🌯 Wrap
</button>

<button class="category"
onclick="setCategory('Salat',this)">
🥗 Salat
</button>

<button class="category"
onclick="setCategory('Ei',this)">
🍳 Eier
</button>

<button class="category"
onclick="setCategory('Kartoffeln',this)">
🥔 Kartoffeln
</button>

</div>
</div>


<div class="card">

<h2>⚙️ Filter</h2>

<div class="filters">

<div>
<label>Max. kcal</label>

<select id="calorieFilter" onchange="showRecipes()">
<option value="600">600 kcal</option>
<option value="500">500 kcal</option>
<option value="400">400 kcal</option>
<option value="300">300 kcal</option>
</select>

</div>

<div>
<label>Max. Zeit</label>

<select id="timeFilter" onchange="showRecipes()">
<option value="30">30 Minuten</option>
<option value="20">20 Minuten</option>
<option value="15">15 Minuten</option>
<option value="10">10 Minuten</option>
</select>

</div>

</div>
</div>


<div class="card">

<h2>🛒 Zutaten zuhause</h2>

<div class="ingredients" id="ingredientButtons"></div>

<button onclick="showRecipes()">
🔎 Mit meinen Zutaten suchen
</button>

<button class="dark" onclick="randomRecipe()">
🎲 Überrasche mich
</button>

</div>


<div id="results"></div>


<div class="card">

<h2>🛒 Meine Einkaufsliste</h2>

<div id="shoppingList"></div>

<button class="red" onclick="clearShoppingList()">
🗑️ Einkaufsliste leeren
</button>

</div>


<div class="card">

<h2>❤️ Meine Favoriten</h2>

<div id="favorites"></div>

</div>

</div>


<script>

/* =========================================================
   REZEPT-DATEN
   ========================================================= */

const proteins=[
["Hähnchenbrust","Hähnchen"],
["Putenbrust","Hähnchen"],
["Thunfisch","Salat"],
["Rinderhackfleisch","Hackfleisch"],
["Schinken","Schinken"],
["Eier","Ei"],
["Mozzarella","Salat"]
];

const vegetables=[
["Paprika","Paprika"],
["Tomaten","Tomaten"],
["Zucchini","Zucchini"],
["Brokkoli","Brokkoli"],
["Karotten","Karotten"],
["Mais","Mais"],
["Erbsen","Erbsen"],
["Gurke","Gurke"],
["Spinat","Spinat"],
["Zwiebel","Zwiebel"],
["Champignons","Champignons"],
["Salat","Salat"]
];

const carbs=[
["Reis","Reis"],
["Nudeln","Pasta"],
["Kartoffeln","Kartoffeln"],
["Wrap","Wrap"],
["Brot","Brot"]
];

const sauces=[
["Tomatensauce","Tomate"],
["Pesto","Pesto"],
["Quark","Quark"],
["Frischkäse","Frischkäse"],
["Joghurt","Joghurt"]
];

const ingredientList=[
"Hähnchenbrust",
"Putenbrust",
"Thunfisch",
"Rinderhackfleisch",
"Schinken",
"Eier",
"Mozzarella",
"Reis",
"Nudeln",
"Kartoffeln",
"Wrap",
"Brot",
"Paprika",
"Tomaten",
"Zucchini",
"Brokkoli",
"Karotten",
"Mais",
"Erbsen",
"Gurke",
"Spinat",
"Zwiebel",
"Champignons",
"Salat",
"Pesto",
"Quark",
"Frischkäse",
"Joghurt",
"Parmesan"
];


/* =========================================================
   500+ REZEPTE AUTOMATISCH ERSTELLEN
   ========================================================= */

const recipes=[];

let recipeId=1;

const styles=[
"Pfanne",
"Bowl",
"Power-Teller",
"Mix",
"Fitness-Pfanne",
"Gemüsepfanne",
"Schnelle Pfanne",
"Reispfanne"
];

function addRecipe(name,category,time,calories,ingredients,steps){

recipes.push({
id:recipeId++,
name:name,
category:category,
time:time,
calories:calories,
ingredients:ingredients,
steps:steps
});

}


/* Hähnchen + Gemüse + Beilage */

for(let p of proteins){

for(let v of vegetables){

for(let c of carbs){

let baseCal=
p[0]==="Eier"?180:
p[0]==="Mozzarella"?220:
p[0]==="Thunfisch"?130:
p[0]==="Schinken"?150:
p[0]==="Rinderhackfleisch"?250:
220;

let carbCal=
c[0]==="Reis"?180:
c[0]==="Nudeln"?210:
c[0]==="Kartoffeln"?180:
c[0]==="Wrap"?170:
150;

let vegCal=70;

let kcal=Math.min(
590,
baseCal+carbCal+vegCal
);

let time=
c[0]==="Kartoffeln"?28:
18;

let category;

if(c[0]==="Nudeln") category="Pasta";
else if(c[0]==="Reis") category="Reis";
else if(c[0]==="Wrap") category="Wrap";
else if(c[0]==="Kartoffeln") category="Kartoffeln";
else if(p[0]==="Eier") category="Ei";
else category="Hähnchen";

let style=
styles[recipeId%styles.length];

addRecipe(
"🍽️ "+p[0]+"-"+v[0]+"-"+c[0]+" "+style,
category,
time,
kcal,
[
[p[0],p[0]==="Eier"?2:120,p[0]==="Eier"?"Stück":"g"],
[v[0],1,"Portion"],
[c[0],c[0]==="Wrap"?1:70,c[0]==="Wrap"?"Stück":"g"]
],
[
p[0]+" vorbereiten und klein schneiden.",
v[0]+" schneiden.",
c[0]+" nach Packungsanleitung zubereiten.",
p[0]+" in einer Pfanne anbraten.",
v[0]+" dazugeben und mitbraten.",
c[0]+" unterheben.",
"Nach Geschmack würzen und servieren."
]
);

}
}
}


/* Zusätzliche vegetarische Rezepte */

for(let v of vegetables){

for(let c of carbs){

let kcal=
(c[0]==="Nudeln"?240:
c[0]==="Reis"?210:
c[0]==="Kartoffeln"?190:
c[0]==="Wrap"?180:160)
+80;

let category=
c[0]==="Nudeln"?"Pasta":
c[0]==="Reis"?"Reis":
c[0]==="Wrap"?"Wrap":
c[0]==="Kartoffeln"?"Kartoffeln":"Salat";

addRecipe(
"🥗 Gemüse-"+v[0]+"-"+c[0],
category,
15,
Math.min(kcal,500),
[
[v[0],1,"Portion"],
[c[0],70,c[0]==="Wrap"?"Stück":"g"],
["Mozzarella",60,"g"]
],
[
v[0]+" klein schneiden.",
c[0]+" vorbereiten.",
"Gemüse in der Pfanne anbraten.",
"Mozzarella dazugeben.",
"Alles vermischen und würzen."
]
);

}
}


/* Eier-Rezepte */

for(let v of vegetables){

addRecipe(
"🍳 Eier mit "+v[0]+" und Mozzarella",
"Ei",
12,
380,
[
["Eier",3,"Stück"],
[v[0],1,"Portion"],
["Mozzarella",50,"g"]
],
[
"Eier verquirlen.",
v[0]+" schneiden.",
"Gemüse kurz anbraten.",
"Eier dazugeben.",
"Mozzarella darüber verteilen.",
"Stocken lassen und servieren."
]
);

}


/* =========================================================
   SICHERSTELLEN, DASS ES ÜBER 500 REZEPTE SIND
   ========================================================= */

while(recipes.length<550){

let index=recipes.length;

let p=proteins[index%proteins.length];
let v=vegetables[(index*3)%vegetables.length];
let c=carbs[(index*2)%carbs.length];

let category=
c[0]==="Nudeln"?"Pasta":
c[0]==="Reis"?"Reis":
c[0]==="Wrap"?"Wrap":
c[0]==="Kartoffeln"?"Kartoffeln":
p[0]==="Eier"?"Ei":
"Salat";

addRecipe(
"🍽️ Spezial-Rezept "+(index+1)+": "+p[0]+" mit "+v[0]+" und "+c[0],
category,
15+(index%15),
350+(index%240),
[
[p[0],p[0]==="Eier"?2:120,p[0]==="Eier"?"Stück":"g"],
[v[0],1,"Portion"],
[c[0],70,c[0]==="Wrap"?"Stück":"g"]
],
[
"Alle Zutaten vorbereiten.",
p[0]+" vorbereiten.",
v[0]+" klein schneiden.",
c[0]+" zubereiten.",
"Alles miteinander vermischen.",
"Nach Geschmack würzen und servieren."
]
);

}


/* =========================================================
   ZUTATEN-AUSWAHL
   ========================================================= */

let selectedIngredients=[];

let currentCategory="Alle";

let shoppingList=
JSON.parse(localStorage.getItem("shoppingList")||"[]");

let favorites=
JSON.parse(localStorage.getItem("favorites")||"[]");

let portions={};

const ingredientButtons=
document.getElementById("ingredientButtons");

ingredientList.forEach(item=>{

const el=document.createElement("div");

el.className="ingredient";

el.textContent=item;

el.onclick=()=>{

el.classList.toggle("selected");

if(selectedIngredients.includes(item)){

selectedIngredients=
selectedIngredients.filter(x=>x!==item);

}else{

selectedIngredients.push(item);

}

showRecipes();

};

ingredientButtons.appendChild(el);

});


/* =========================================================
   SUCHE
   ========================================================= */

function normalize(text){

return text
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/ß/g,"ss")
.replace(/[^a-z0-9\s]/g," ");

}


function showRecipes(){

const searchText=
document.getElementById("search").value.trim();

const searchWords=
normalize(searchText)
.split(/\s+/)
.filter(Boolean);

const maxCalories=
Number(document.getElementById("calorieFilter").value);

const maxTime=
Number(document.getElementById("timeFilter").value);


let results=recipes.filter(recipe=>{

const searchable=normalize(
recipe.name+" "+
recipe.category+" "+
recipe.ingredients.map(x=>x[0]).join(" ")
);

const matchesSearch=
searchWords.length===0 ||
searchWords.every(word=>
searchable.includes(word)
);

const matchesCategory=
currentCategory==="Alle" ||
recipe.category===currentCategory;

const matchesCalories=
recipe.calories<=maxCalories;

const matchesTime=
recipe.time<=maxTime;

return(
matchesSearch &&
matchesCategory &&
matchesCalories &&
matchesTime
);

});


/* Zutaten zuhause */

if(selectedIngredients.length>0){

results=results
.map(recipe=>{

let matches=
recipe.ingredients.filter(x=>
selectedIngredients.some(selected=>
normalize(x[0]).includes(normalize(selected)) ||
normalize(selected).includes(normalize(x[0]))
)
).length;

return{
...recipe,
matches:matches
};

})
.filter(recipe=>recipe.matches>0)
.sort((a,b)=>b.matches-a.matches);

}


renderRecipes(results);

}


/* =========================================================
   KATEGORIE
   ========================================================= */

function setCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

showRecipes();

}


/* =========================================================
   REZEPTE ANZEIGEN
   ========================================================= */

function renderRecipes(results){

const container=
document.getElementById("results");

container.innerHTML="";

if(results.length===0){

container.innerHTML=`
<div class="card empty">
😕 Kein passendes Rezept gefunden.<br><br>
Versuche andere Zutaten oder entferne einen Filter.
</div>`;

return;

}

container.innerHTML=`
<div class="result-count">
🍽️ ${results.length} passende Rezepte
</div>
`;

results.slice(0,80).forEach(recipe=>{

container.innerHTML+=recipeHTML(recipe);

});

}


/* =========================================================
   REZEPT HTML
   ========================================================= */

function safeId(name){

return name
.replace(/[^a-zA-Z0-9]/g,"")
.slice(0,40);

}


function recipeHTML(recipe){

const favorite=
favorites.includes(recipe.name);

const amount=
portions[recipe.name]||1;

return`

<div class="recipe">

<h3>${recipe.name}</h3>

<div class="info">

<span>⏱️ ${recipe.time} Min.</span>

<span>🔥 ${recipe.calories} kcal</span>

<span class="badge">
${recipe.category}
</span>

</div>


<h4>👥 Portionen</h4>

<div class="portions">

<button
onclick="changePortions('${escapeName(recipe.name)}',-1)">
−
</button>

<span id="portion-${safeId(recipe.name)}">
${amount}
</span>

<button
onclick="changePortions('${escapeName(recipe.name)}',1)">
+
</button>

</div>


<h4>🛒 Zutaten</h4>

<ul id="ingredients-${safeId(recipe.name)}">

${recipe.ingredients.map(x=>
`
<li>
${formatAmount(x[1],x[2],amount)}
${x[0]}
</li>
`
).join("")}

</ul>


<h4>👨‍🍳 Zubereitung</h4>

<ol>

${recipe.steps.map(x=>
`<li>${x}</li>`
).join("")}

</ol>


<button
class="green"
onclick="addToShopping('${escapeName(recipe.name)}')">

🛒 Zur Einkaufsliste

</button>


<button
class="favorite"
onclick="toggleFavorite('${escapeName(recipe.name)}')">

${favorite?
"💔 Aus Favoriten entfernen":
"❤️ Favorit speichern"}

</button>

</div>

`;

}


/* =========================================================
   SONDERZEICHEN FÜR ONCLICK
   ========================================================= */

function escapeName(name){

return name
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* =========================================================
   PORTIONEN
   ========================================================= */

function changePortions(name,direction){

name=name.replace(/\\'/g,"'");

if(!portions[name])
portions[name]=1;

portions[name]+=direction;

if(portions[name]<1)
portions[name]=1;

if(portions[name]>6)
portions[name]=6;

showRecipes();

}


/* =========================================================
   MENGEN
   ========================================================= */

function formatAmount(amount,unit,portion=1){

let value=amount*portion;

if(Number.isInteger(value))
return value+" "+unit;

return value.toFixed(1)+" "+unit;

}


/* =========================================================
   EINKAUFSLISTE
   ========================================================= */

function addToShopping(name){

name=name.replace(/\\'/g,"'");

const recipe=
recipes.find(x=>x.name===name);

if(!recipe)return;

recipe.ingredients.forEach(item=>{

const amount=
item[1]*(portions[name]||1);

shoppingList.push({
text:amount+" "+item[2]+" "+item[0],
done:false
});

});

localStorage.setItem(
"shoppingList",
JSON.stringify(shoppingList)
);

renderShoppingList();

alert("🛒 Zutaten wurden zur Einkaufsliste hinzugefügt!");

}


function renderShoppingList(){

const container=
document.getElementById("shoppingList");

container.innerHTML="";

if(shoppingList.length===0){

container.innerHTML=
`<div class="empty">
Noch keine Zutaten auf der Einkaufsliste.
</div>`;

return;

}

shoppingList.forEach((item,index)=>{

container.innerHTML+=`

<div class="shop ${item.done?"done":""}">

<input
type="checkbox"
${item.done?"checked":""}
onchange="toggleShopping(${index})">

<span>${item.text}</span>

<button
class="delete"
onclick="deleteShopping(${index})">
✕
</button>

</div>

`;

});

}


function toggleShopping(index){

shoppingList[index].done=
!shoppingList[index].done;

localStorage.setItem(
"shoppingList",
JSON.stringify(shoppingList)
);

renderShoppingList();

}


function deleteShopping(index){

shoppingList.splice(index,1);

localStorage.setItem(
"shoppingList",
JSON.stringify(shoppingList)
);

renderShoppingList();

}


function clearShoppingList(){

shoppingList=[];

localStorage.setItem(
"shoppingList",
"[]"
);

renderShoppingList();

}


/* =========================================================
   FAVORITEN
   ========================================================= */

function toggleFavorite(name){

name=name.replace(/\\'/g,"'");

if(favorites.includes(name)){

favorites=
favorites.filter(x=>x!==name);

}else{

favorites.push(name);

}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

showRecipes();
renderFavorites();

}


function renderFavorites(){

const container=
document.getElementById("favorites");

container.innerHTML="";

if(favorites.length===0){

container.innerHTML=
`<div class="empty">
Noch keine Favoriten gespeichert.
</div>`;

return;

}

favorites.forEach(name=>{

const recipe=
recipes.find(x=>x.name===name);

if(!recipe)return;

container.innerHTML+=`

<div class="shop">

<span>
❤️ ${recipe.name}
</span>

<button
class="delete"
onclick="removeFavorite('${escapeName(name)}')">
✕
</button>

</div>

`;

});

}


function removeFavorite(name){

name=name.replace(/\\'/g,"'");

favorites=
favorites.filter(x=>x!==name);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

renderFavorites();
showRecipes();

}


/* =========================================================
   ÜBERRASCHUNG
   ========================================================= */

function randomRecipe(){

const maxCalories=
Number(document.getElementById("calorieFilter").value);

const maxTime=
Number(document.getElementById("timeFilter").value);

const possible=
recipes.filter(recipe=>
recipe.calories<=maxCalories &&
recipe.time<=maxTime
);

if(possible.length===0){

alert("Kein Rezept mit diesen Filtern gefunden.");

return;

}

const recipe=
possible[Math.floor(Math.random()*possible.length)];

document.getElementById("search").value=
recipe.name;

currentCategory="Alle";

document
.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

document
.querySelector(".category")
.classList.add("active");

showRecipes();

setTimeout(()=>{

const first=
document.querySelector(".recipe");

if(first){

first.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

},100);

}


/* =========================================================
   START
   ========================================================= */

renderShoppingList();

renderFavorites();

showRecipes();

</script>

</body>
</html>
